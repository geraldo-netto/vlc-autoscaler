name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, test, fuzz-smoke, analyze
    runs-on: ubuntu-latest
    # GitHub Actions ubuntu-latest runners have inconsistent AVX-512
    # availability — some have it, some don't. We pin the full
    # MARCH=x86-64-v3 level for CI; every runner SKU supports that level.
    # Local builds default to MARCH=native. CI also links dedicated
    # SSE2/AVX2/AVX-512 variants; test_usm_pool_variants gates execution per
    # CPU, while the linked-ISA check only disassembles them.
    env:
      MARCH: x86-64-v3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang clang-tools cppcheck pkg-config python3-pip \
            libvlccore-dev libvlc-dev \
            libswscale-dev libavutil-dev libzimg-dev
          # lizard is used by `make analyze` (complexity gate, CCN<=10).
          # --break-system-packages is needed on Ubuntu 24.04+ runners
          # (PEP 668); the runner is single-purpose so the warning is
          # irrelevant.
          pip3 install --user --break-system-packages lizard
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain info
        run: make info

      - name: Build the VLC plugin (gcc, -Werror)
        run: |
          make plugin EXTRA_CFLAGS=-Werror
          make check-visibility EXTRA_CFLAGS=-Werror

      # BUILD-4: also compile the shipped plugin under clang so clang-only
      # warnings and codegen don't go untested. -Wno-unreachable-code-generic-
      # assoc suppresses a false positive from VLC's own _Generic macros
      # (var_GetChecked), not our code.
      - name: Build the VLC plugin (clang, -Werror)
        run: |
          make clean
          make plugin CC=clang \
            EXTRA_CFLAGS="-Werror -Wno-unreachable-code-generic-assoc"
          make clean

      # The test/fuzz/stress/coverage TUs build under -Werror too,
      # so new warnings in harness code fail CI, not just plugin code. The
      # -Wno-unreachable-code-generic-assoc suppresses a clang false
      # positive inside VLC's own _Generic headers (gcc ignores the
      # unknown -Wno- flag as long as no other diagnostic fires).
      # BUILD-3: link the production runtime-dispatch configuration too.
      # This is the exact unresolved-symbol hazard usm_pool.h warns about
      # (un-suffixed API resolved against usm_pool_dispatch.o under -O3
      # -flto); a prototype/symbol drift fails this link.
      - name: Build the VLC plugin (MULTIVERSION=1 runtime dispatch, -Werror)
        run: |
          make clean
          make plugin MULTIVERSION=1 EXTRA_CFLAGS=-Werror
          make check-visibility MULTIVERSION=1 EXTRA_CFLAGS=-Werror
          make check-multiversion-isa MULTIVERSION=1 EXTRA_CFLAGS=-Werror
          make clean

      - name: Unit tests (ASan + UBSan) + complexity gate
        run: make check EXTRA_CFLAGS=-Werror

      - name: zimg backend invariants (ASan + UBSan)
        run: make test-zimg EXTRA_CFLAGS="-Werror -Wno-unreachable-code-generic-assoc"

      - name: Smoke fuzz (ASan + UBSan)
        run: make fuzz-smoke EXTRA_CFLAGS=-Werror

      - name: Concurrency stress (usm_pool, ASan + TSan)
        run: make stress EXTRA_CFLAGS=-Werror

      - name: zimg backend stress (ASan + UBSan + TSan)
        run: make stress-zimg EXTRA_CFLAGS="-Werror -Wno-unreachable-code-generic-assoc"

      # BUILD-5: the USM_POOL_FLAT_SKIP=1 code path only compiles in the
      # bench binaries; build (not run) them so that opt-in path can't rot.
      - name: Compile benches incl. flat-skip kernel (build only)
        run: make build-bench EXTRA_CFLAGS="-Werror -Wno-unreachable-code-generic-assoc"

      - name: Per-file and per-function coverage gates
        run: make coverage EXTRA_CFLAGS=-Werror

      - name: Static analysis (cppcheck + Clang Static Analyzer)
        run: |
          make analyze
          make scan-build SCAN_CC=clang \
            EXTRA_CFLAGS="-Werror -Wno-unreachable-code-generic-assoc"

  libfuzzer:
    name: libFuzzer
    runs-on: ubuntu-latest
    env:
      MARCH: x86-64-v3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        # VLC + zimg headers let this job build fuzz_scaler_seam too
        # (BUILD-9); without them the seam corpus was never replayed
        # under libFuzzer.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config \
            libvlccore-dev libvlc-dev libzimg-dev

      - name: Build fuzzers
        run: make fuzz

      # BUILD-9: every built fuzzer gets at least a short libFuzzer pass;
      # previously 8 of 13 were built but never run.
      - name: Run libFuzzer (pure-logic targets, short pass)
        run: |
          for t in perfmon threading copy_plane stripe_bounds \
                   decide_tile_grid scaler_open picture_view; do
            mkdir -p "corpus_$t"
            "build/fuzz_$t" "corpus_$t" -max_total_time=30 -print_final_stats=1
          done

      - name: Run libFuzzer (usm_variants, curated corpus)
        run: |
          mkdir -p corpus_usm_variants_work
          cp tests/corpus_usm_variants/* corpus_usm_variants_work/ 2>/dev/null || true
          build/fuzz_usm_variants corpus_usm_variants_work \
            -max_total_time=60 -print_final_stats=1

      - name: Run libFuzzer (scaler_seam, curated corpus)
        run: |
          mkdir -p corpus_scaler_seam_work
          cp tests/corpus_scaler_seam/* corpus_scaler_seam_work/ 2>/dev/null || true
          build/fuzz_scaler_seam corpus_scaler_seam_work \
            -max_total_time=90 -max_len=16 -print_final_stats=1

      - name: Run libFuzzer (upscale_logic)
        run: |
          mkdir -p corpus_logic
          if [ -d tests/corpus ]; then cp tests/corpus/* corpus_logic/ 2>/dev/null || true; fi
          build/fuzz_upscale_logic corpus_logic -max_total_time=60 -print_final_stats=1

      - name: Run libFuzzer (usm)
        run: |
          mkdir -p corpus_usm
          build/fuzz_usm corpus_usm -max_total_time=60 -max_len=64 -print_final_stats=1

      - name: Run libFuzzer (frame_shape)
        run: |
          mkdir -p corpus_frame_shape
          if [ -d tests/corpus_frame_shape ]; then cp tests/corpus_frame_shape/* corpus_frame_shape/ 2>/dev/null || true; fi
          build/fuzz_frame_shape corpus_frame_shape -max_total_time=60 -max_len=24 -print_final_stats=1

      - name: Run libFuzzer (scaler_chroma)
        run: |
          mkdir -p corpus_scaler_chroma
          if [ -d tests/corpus_scaler_chroma ]; then cp tests/corpus_scaler_chroma/* corpus_scaler_chroma/ 2>/dev/null || true; fi
          build/fuzz_scaler_chroma corpus_scaler_chroma -max_total_time=60 -max_len=8 -print_final_stats=1

      - name: Run libFuzzer (content_probe)
        run: |
          mkdir -p corpus_content_probe
          build/fuzz_content_probe corpus_content_probe -max_total_time=60 -max_len=64 -print_final_stats=1

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzer-findings
          path: |
            crash-*
            timeout-*
            leak-*

  sonarcloud:
    name: SonarCloud (C/C++ scan, tests excluded)
    runs-on: ubuntu-latest
    env:
      MARCH: x86-64-v3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Sonar needs full history for blame / new-code detection.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config unzip gcovr \
            libvlccore-dev libvlc-dev \
            libswscale-dev libavutil-dev libzimg-dev

      - name: Download SonarCloud build-wrapper
        # The previous action `SonarSource/sonarcloud-github-c-cpp` was
        # deprecated and the repo removed. The canonical replacement is
        # downloading build-wrapper directly from SonarCloud's static
        # endpoint, which is what that action did internally.
        run: |
          curl -sSLo build-wrapper.zip \
            https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -o build-wrapper.zip -d "$HOME"
          echo "$HOME/build-wrapper-linux-x86" >> "$GITHUB_PATH"

      - name: Build plugin under build-wrapper
        # Build the production target only — tests are not invoked.
        # build-wrapper captures every compiler invocation into
        # bw-output/ so the sonar-scanner can analyse the C/C++ TUs.
        # BUILD-2: MULTIVERSION=1 so the runtime dispatcher
        # (usm_pool_dispatch.c) and the per-march variant compilations of
        # usm_pool.c are captured too; the default MULTIVERSION=0 build links
        # only usm_pool.o, leaving the dispatch/SIMD code unanalysed.
        run: |
          build-wrapper-linux-x86-64 --out-dir bw-output make plugin MULTIVERSION=1

      - name: Generate coverage report for Sonar
        # Separate from the build-wrapper build above: `make coverage` builds
        # and runs the instrumented unit tests (gcc --coverage), leaving .gcda
        # in build/cov. gcovr aggregates them across all test binaries into a
        # single SonarQube generic-coverage XML with root-relative src/ paths,
        # which sonar.coverageReportPaths points at.
        run: |
          make coverage
          gcovr --root . --filter 'src/' \
            --sonarqube coverage-sonar.xml build/cov
          make coverage-zimg
          gcovr --root . --filter 'src/scaler_zimg\.c' \
            --sonarqube coverage-zimg-sonar.xml build/covz

      - name: Run sonar-scanner and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
