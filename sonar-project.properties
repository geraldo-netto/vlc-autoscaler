sonar.organization=geraldo-netto
sonar.projectKey=geraldo-netto_vlc-autoscaler

# Production sources only. tests/ is intentionally excluded:
# unit tests, fuzzers, and benches are not part of the shipped plugin
# and should not be measured as production code.
sonar.sources=src
sonar.exclusions=tests/**,build/**,patches/**,docs/**,scripts/**

# Tests disabled — no sonar.tests path is configured, so no test
# files are scanned and no coverage/test-execution data is uploaded.
sonar.tests=

# C/C++ analyzer reads compile metadata produced by build-wrapper.
sonar.cfamily.build-wrapper-output=bw-output

# Encoding + SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Per-file rule exclusions.
#
# src/usm.h legitimately uses the C99 `restrict` qualifier on the inner
# loop kernels (up_usm__hblur_row, up_usm__combine_row): it lets the
# compiler vectorise the byte-per-pixel loop because src/dst/workspace
# rows are guaranteed non-overlapping by the caller (per-stripe layout
# in usm_pool.c and the single-threaded fast path). SonarCloud's
# "Remove the use of the 'restrict' type qualifier" rule treats this
# as a portability concern; here it is load-bearing for performance
# and the contract is documented at every call site.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=c:S5953
sonar.issue.ignore.multicriteria.e1.resourceKey=**/src/usm.h
